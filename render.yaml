services:
  - type: web
    name: ai-customer-support-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: POSTGRES_SSL
        value: "true"
      - key: PYTHON_VERSION
        value: 3.12.8
